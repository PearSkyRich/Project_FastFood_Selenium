name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fastfood_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show git commit and data.sql
        run: |
          echo "GIT HEAD: $(git rev-parse HEAD)"
          echo "data.sql (repo):"
          sed -n '1,200p' backend/src/test/resources/data.sql || true

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Cache Sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install mysql client & wait for MySQL
        run: |
          sudo apt-get update -y
          sudo apt-get install -y default-mysql-client
          echo "Waiting for MySQL to accept connections..."
          for i in $(seq 1 30); do
            mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT 1" && break
            echo "MySQL not ready yet - retrying ($i)..."
            sleep 2
          done
          echo "Ensure database exists"
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "CREATE DATABASE IF NOT EXISTS fastfood_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Prepare test-classes and show compiled data.sql
        working-directory: backend
        run: |
          mvn -q -DskipTests=true test-compile
          echo "test-classes data.sql:"
          sed -n '1,200p' target/test-classes/data.sql || true

      - name: Build and analyze
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/fastfood_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: |
          mvn -B verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=PearSkyRich_IT-Project-Management-Course-Project-Online-Bookstore-System